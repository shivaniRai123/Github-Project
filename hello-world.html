<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="A little hello, made to brighten your day.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f7f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, #4d2c9355, transparent 42%),
        radial-gradient(ellipse at 85% 78%, #087e8b44, transparent 38%),
        #0b1020;
    }
    .glow {
      position: fixed;
      width: 24rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .24;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .glow.one { background: #9b5cff; top: -10rem; left: -7rem; }
    .glow.two { background: #19d3c5; right: -10rem; bottom: -11rem; animation-delay: -6s; }
    main {
      position: relative;
      width: min(90vw, 760px);
      padding: clamp(2.5rem, 8vw, 5.5rem) 1.5rem;
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 28px;
      background: linear-gradient(145deg, #ffffff12, #ffffff05);
      box-shadow: 0 30px 100px #0008, inset 0 1px #ffffff16;
      backdrop-filter: blur(18px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .sparkle {
      display: inline-grid;
      width: 3.5rem;
      aspect-ratio: 1;
      place-items: center;
      margin-bottom: 1.5rem;
      border: 1px solid #ffffff24;
      border-radius: 18px;
      background: #ffffff0d;
      font-size: 1.65rem;
      box-shadow: 0 0 40px #a56eff32;
    }
    p.eyebrow {
      margin: 0 0 .8rem;
      color: #c0b3ff;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.2rem);
      line-height: 1;
      letter-spacing: -.065em;
      background: linear-gradient(100deg, #fff 15%, #cdbbff 55%, #86f5e6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .message {
      max-width: 34rem;
      margin: 1.35rem auto 0;
      color: #bdc3d8;
      font-size: clamp(1rem, 2.6vw, 1.18rem);
      line-height: 1.7;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 2rem;
      padding: .65rem 1rem;
      border: 1px solid #ffffff20;
      border-radius: 999px;
      color: #e7e8f4;
      background: #ffffff09;
      font-size: .85rem;
    }
    .dot { width: .45rem; height: .45rem; border-radius: 50%; background: #57e3bd; box-shadow: 0 0 12px #57e3bd; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(35px, 24px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A tiny page with big energy</p>
    <h1>Hello, World!</h1>
    <p class="message">A fresh little corner of the internet. Here’s to bright ideas, new beginnings, and whatever you build next.</p>
    <div class="pill"><span class="dot" aria-hidden="true"></span> All systems go</div>
  </main>
</body>
</html>
